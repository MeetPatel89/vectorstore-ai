[project]
name = "vectorstore-ai"
version = "0.1.0"
description = "Extensible structured, dense, lexical, and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
chroma = [
    "chromadb>=1.5.5",
]
faiss = [
    "faiss-cpu>=1.14.3",
]
azure-sql = [
    "mssql-python>=1.11.0",
]
local = [
    "sentence-transformers>=5.0",
    "torch>=2.9",
]
otel = [
    "opentelemetry-api>=1.30",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "chromadb>=1.5.5",
    "faiss-cpu>=1.14.3",
    "mypy>=2.3.0",
    "opentelemetry-sdk>=1.30",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_model: loads a real sentence-transformers model (requires the 'local' extra)",
]

[tool.mypy]
files = ["src", "tests", "main.py", "examples"]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
enable_error_code = ["explicit-override"]
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true

[tool.ty.src]
include = ["src", "tests", "main.py", "examples"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
ignore = [
    # Backend adapters intentionally cross dynamically typed third-party APIs.
    "ANN401",
    # Magic methods inherit their behavior from the documented public object.
    "D105",
]
select = [
    "E",
    "F",
    "I",
    "PTH",
    "N",
    "D",
    "C4",
    "ANN",
    "PYI",
]

[tool.ruff.lint.per-file-ignores]
# Test names describe behavior more usefully than duplicate public-API docstrings.
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
