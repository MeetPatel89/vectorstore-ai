[project]
name = "vectorstore-ai"
version = "0.1.0"
description = "Extensible structured, dense, lexical, and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "openai>=1.0",
    "tiktoken>=0.12.0",
]

[project.urls]
Repository = "https://github.com/MeetPatel89/vectorstore-ai"
Documentation = "https://github.com/MeetPatel89/vectorstore-ai/blob/main/README.md"
Issues = "https://github.com/MeetPatel89/vectorstore-ai/issues"
Changelog = "https://github.com/MeetPatel89/vectorstore-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
chroma = [
    "chromadb>=1.5.5",
]
faiss = [
    "faiss-cpu>=1.14.3",
]
azure-sql = [
    "mssql-python>=1.11.0",
]
local = [
    "sentence-transformers>=5.0",
    "torch>=2.9",
]
otel = [
    "opentelemetry-api>=1.30",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7",
]
dev = [
    {include-group = "test"},
    "mypy>=2.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
backend-test = ["opentelemetry-sdk>=1.30"]
build = ["hatchling>=1.32,<2", "twine>=6.2,<8"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorstore"]
# Twine 6.2 validates up to 2.4; this retains SPDX license metadata.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src/vectorstore", "/tests", "/scripts", "/examples", "/docs",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md",
    "/SECURITY.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/main.py",
]
exclude = ["*.pyc", "__pycache__", "*.plan.md", ".env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "local_model: loads a real sentence-transformers model (requires the 'local' extra)",
    "postgres_integration: uses VECTORSTORE_TEST_POSTGRES_DSN and isolated test schemas",
]

[tool.mypy]
files = ["src", "tests", "scripts", "main.py", "examples"]
python_version = "3.14"
strict = true
enable_error_code = ["explicit-override"]
show_error_codes = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.ty.src]
include = ["src", "tests", "scripts", "main.py", "examples"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
ignore = [
    # Backend adapters intentionally cross dynamically typed third-party APIs.
    "ANN401",
    # Magic methods inherit their behavior from the documented public object.
    "D105",
]
select = [
    "E",
    "F",
    "I",
    "PTH",
    "N",
    "D",
    "C4",
    "ANN",
    "PYI",
]

[tool.ruff.lint.per-file-ignores]
# Test names describe behavior more usefully than duplicate public-API docstrings.
"tests/**/*.py" = ["D"]
# Skip optional SDK tests before importing their dependencies.
"tests/test_otel_observer.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
