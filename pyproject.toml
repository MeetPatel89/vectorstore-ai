[project]
name = "vectorstore-ai"
version = "0.1.0"
description = "An extensible vector store library for semantic search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.5",
    "numpy>=2.1",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
