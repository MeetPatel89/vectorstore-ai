name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.10"
  UV_NO_PROGRESS: "1"
  TIKTOKEN_CACHE_DIR: ".cache/tiktoken"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  ANONYMIZED_TELEMETRY: "False"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - name: Validate release metadata and ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --isolated --no-project --python 3.14 python -m scripts.release_metadata "$RELEASE_TAG"
      - run: >-
          uv sync --locked --group backend-test --extra chroma --extra faiss
          --extra otel --extra postgres --extra azure-sql
      - name: Python quality checks
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync ty check
          uv run --no-sync mypy
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  tests:
    name: Tests (${{ matrix.dependencies }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [core, backends]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.dependencies }}
      - run: uv python install
      - name: Install core test dependencies
        if: matrix.dependencies == 'core'
        run: uv sync --locked --no-default-groups --group test
      - name: Install driver system dependencies
        if: matrix.dependencies == 'backends'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libltdl7 libkrb5-3 libgssapi-krb5-2
      - name: Install backend test dependencies
        if: matrix.dependencies == 'backends'
        run: >-
          uv sync --locked --no-default-groups --group test --group backend-test
          --extra chroma --extra faiss --extra otel --extra postgres --extra azure-sql
      - name: Require the expected backend imports
        if: matrix.dependencies == 'backends'
        run: uv run --no-sync python -c 'from importlib import import_module; [import_module(name) for name in ("chromadb", "faiss", "opentelemetry.sdk", "psycopg", "mssql_python")]'
      - name: Prepare tokenizer asset before blocking network access
        run: uv run --no-sync python -c 'from tiktoken import get_encoding; get_encoding("cl100k_base")'
      - name: Run unit and contract tests
        run: >-
          uv run --no-sync pytest -m "not local_model and not postgres_integration"
          --disable-socket --allow-unix-socket --junitxml=reports/tests.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.dependencies }}-${{ github.run_attempt }}
          path: reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vectorstore
          POSTGRES_PASSWORD: vectorstore_test
          POSTGRES_DB: vectorstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vectorstore -d vectorstore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VECTORSTORE_TEST_POSTGRES_DSN: postgresql://vectorstore:vectorstore_test@127.0.0.1:5432/vectorstore_test
      VECTORSTORE_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked --no-default-groups --group test --extra postgres
      - run: uv run --no-sync python -c 'from psycopg import connect; assert callable(connect)'
      - run: uv run --no-sync pytest -m postgres_integration --junitxml=reports/postgres.xml
      - name: Save PostgreSQL results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-${{ github.run_attempt }}
          path: reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv python install
      - name: Build with locked tools
        run: |
          uv sync --locked --only-group build
          uv build --no-sources --no-build-isolation
          uv run --no-sync twine check --strict dist/*
          uv run --no-sync python -m scripts.check_dist dist
      - name: Install driver system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libltdl7 libkrb5-3 libgssapi-krb5-2
      - name: Test isolated wheel and source installs
        run: |
          project_version="$(uv version --short)"
          wheel="$(realpath dist/*.whl)"
          sdist="$(realpath dist/*.tar.gz)"
          cd "$RUNNER_TEMP"
          for extra in core chroma faiss otel postgres azure-sql; do
            requirement="vectorstore-ai[$extra] @ file://$wheel"
            if [ "$extra" = core ]; then requirement="vectorstore-ai @ file://$wheel"; fi
            uv run --isolated --no-project --python 3.14 --with "$requirement" python "$GITHUB_WORKSPACE/tests/package_smoke.py" "$project_version" --extra "$extra"
          done
          uv run --isolated --no-project --python 3.14 --with "vectorstore-ai @ file://$sdist" python "$GITHUB_WORKSPACE/tests/package_smoke.py" "$project_version"
      - name: Run documented demos from the source distribution
        run: |
          unpacked="$(mktemp -d "$RUNNER_TEMP/vectorstore-sdist.XXXXXX")"
          tar -xzf dist/*.tar.gz -C "$unpacked" --strip-components=1
          uv sync --project "$unpacked" --locked
          for demo in "$unpacked"/examples/0[1-5]_*.py "$unpacked/main.py"; do
            uv run --project "$unpacked" --no-sync python "$demo"
          done
      - name: Extract verified release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-sync python -m scripts.release_metadata "$RELEASE_TAG" --notes-out dist/RELEASE_NOTES.md
      - name: Save validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  ci:
    name: CI
    if: always()
    needs: [quality, tests, postgres, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require all validation jobs to succeed
        run: >-
          python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]);
          failed = [name for name, value in results.items() if value["result"] != "success"];
          assert not failed, f"Required jobs did not succeed: {failed}"'

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'MeetPatel89/vectorstore-ai'
    needs: [ci, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only the stdlib release helper is executed; no package install or build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.package.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: release-dist
      - name: Publish matching validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: >-
          python3 -m scripts.publish_release release-dist
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
